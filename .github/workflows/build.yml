name: Сборка Folio для Windows

# Срабатывает, когда меняется код. Если версии из APP_VERSION ещё нет в релизах —
# собирает Folio.exe и выпускает релиз vX.Y.Z (тег создаётся автоматически).
on:
  push:
    branches: [main]
    paths:
      - "folio.py"
      - "icon.ico"
      - "installer/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Версия
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path folio.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
          Write-Host "Версия $v"
          exit 0

      - uses: actions/setup-python@v5
        if: steps.ver.outputs.exists == 'false'
        with:
          python-version: "3.12"

      - name: Библиотеки
        if: steps.ver.outputs.exists == 'false'
        run: pip install pyside6-essentials python-docx pyinstaller

      - name: Сборка Folio.exe
        if: steps.ver.outputs.exists == 'false'
        run: pyinstaller --noconfirm --clean --windowed --name Folio --icon icon.ico --add-data "icon.ico;." folio.py

      - name: Упаковка
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: |
          Copy-Item installer/Uninstall.bat, installer/uninstall.ps1 dist/Folio
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item dist/Folio pkg/Folio -Recurse
          Copy-Item installer/setup.ps1, installer/Install.bat pkg
          Compress-Archive -Path pkg/* -DestinationPath Folio-windows.zip

      - name: Выпустить релиз
        if: steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Folio ${{ steps.ver.outputs.version }}
          files: Folio-windows.zip
          generate_release_notes: true
